<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiaLink Result - Sarkari Naukri, Result, Admit Card 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Baloo+2:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B00;
      --navy: #1A2D6E;
      --gold: #FFA500;
      --light-orange: #FFF3E0;
      --light-blue: #EEF2FF;
      --red: #D32F2F;
      --green: #1B5E20;
      --white: #ffffff;
      --gray: #f5f5f5;
      --border: #ddd;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: #f0f0f0;
      font-size: 14px;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      background: linear-gradient(90deg, #1A2D6E, #2a4abf, #1A2D6E);
      color: white;
      text-align: center;
      padding: 5px;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .top-bar marquee { color: #FFD700; font-weight: 600; }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, #ffffff 0%, #fff8f0 100%);
      border-bottom: 3px solid var(--orange);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
